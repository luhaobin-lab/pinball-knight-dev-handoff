<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>弹球骑士 · 手绘像素图标库</title><style>
:root{color-scheme:dark;--bg:#100f16;--card:#19151f;--well:#201b27;--ink:#eaddc8;--muted:#ac9b93;--line:#44353e;--accent:#dba67b;--width:256px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1480px;margin:auto;padding:34px 24px 70px}header{border-bottom:1px solid var(--line);padding-bottom:24px}h1{font-size:clamp(28px,4vw,44px);font-weight:550;line-height:1.2;margin:8px 0 16px}.eyebrow{font-size:11px;color:var(--accent);letter-spacing:.16em}p{max-width:950px;color:var(--muted);margin:9px 0}a{color:var(--accent)}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}input,select,button{font:inherit;background:#281e2a;color:var(--ink);border:1px solid var(--line);padding:9px 12px;min-height:44px;border-radius:3px}input{width:250px;max-width:100%}button{cursor:pointer}button.active{border-color:var(--accent);background:#51313b}.group{display:flex;gap:5px;flex-wrap:wrap}.count{color:var(--muted);font-size:13px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px}.card{min-width:0;border:1px solid var(--line);background:var(--card)}.stage{overflow:auto;padding:12px;background:var(--well)}.inner{width:max-content;min-height:384px;margin:auto;display:flex;align-items:center}.stage img{display:block;width:var(--width);height:auto;image-rendering:pixelated;max-width:none}.stage img.mother{image-rendering:auto}.meta{padding:16px}.meta h2{font-size:18px;font-weight:520;margin:0 0 6px}.id{float:right;font-size:11px;color:var(--accent)}.spec{font-size:12px;color:var(--muted)}.links{display:flex;gap:16px;font-size:12px;margin:12px 0}.links a{padding-block:7px}details{font-size:13px;color:var(--muted)}summary{cursor:pointer;min-height:36px}pre{font:inherit;white-space:pre-wrap;margin:8px 0}body.light{--well:#cfc4b2}body.check .stage{background:repeating-conic-gradient(#312936 0% 25%,#443a49 0% 50%) 50%/16px 16px}body.zoom .grid{grid-template-columns:repeat(auto-fit,minmax(550px,1fr))}footer{border-top:1px solid var(--line);padding-top:20px;margin-top:30px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px}.empty{color:var(--muted);padding:40px 0}@media(max-width:640px){main{padding:24px 16px 40px}.grid,body.zoom .grid{grid-template-columns:1fr}.inner{min-height:0}.controls{gap:8px}input{width:100%}}
</style></head><body><main><header><div class="eyebrow">PINBALL KNIGHT / HAND-INKED PIXEL COLLECTION</div><h1>暗黑手绘 · 图标库</h1><p>沿用已确认的墨线与色块风格。装备按 2×1、2×2、2×3 占格分别构图，天赋独立使用方形画布。</p><p id="progress"></p><p>PNG 与图集可直接离线浏览；Git 克隆不含大尺寸母稿。需要“生成母稿”预览或重新导出时，从 Release 下载 icon-mothers.zip，将 mothers/ 放入本目录。</p><p><a href="https://github.com/luhaobin-lab/pinball-knight-dev-handoff/releases/tag/handoff-2026-10-29">下载完整交接包与母稿（GitHub Release）</a></p></header><div class="controls"><input id="search" type="search" aria-label="搜索图标" placeholder="搜索名称、ID、功能"><select id="category" aria-label="图标分类"><option value="all">全部分类</option><option value="item">装备物品</option><option value="talent">天赋</option><option value="1">2×1 小型物品</option><option value="2">2×2 中型物品</option><option value="3">2×3 大型物品</option></select><div class="group"><button data-size="256" class="active">256px</button><button data-size="128">128px</button></div><div class="group"><button data-mode="pixel" class="active">像素 PNG</button><button data-mode="mother">生成母稿</button></div><div class="group"><button data-zoom="1" class="active">1×</button><button data-zoom="2">2×</button></div><div class="group"><button data-bg="dark" class="active">深底</button><button data-bg="light">浅底</button><button data-bg="check">透明棋盘</button></div></div><div class="count" id="count"></div><section class="grid" id="grid"></section><footer><a href="manifest.json">资源清单与图集坐标</a><a href="docs/integration.html">接入说明</a><a href="references/approved-style-board.png">已确认风格标尺</a><a href="qa/technical-validation.json">技术检查记录</a><a href="制作与接入说明.txt">制作流程与跨机接手</a></footer></main><script src="catalog.js"></script><script>
let size=256,zoom=1,mode='pixel';const grid=document.querySelector('#grid');function setActive(button,key){document.querySelectorAll('['+key+']').forEach(b=>b.classList.toggle('active',b===button))}
function render(){const query=document.querySelector('#search').value.trim().toLowerCase(),cat=document.querySelector('#category').value;const found=CATALOG.icons.filter(r=>(cat==='all'||cat===r.category||(r.slot&&String(r.slot.rows)===cat))&&(!query||(r.id+' '+r.name+' '+r.description+' '+r.tags.join(' ')).toLowerCase().includes(query)));document.body.style.setProperty('--width',size*zoom+'px');document.body.classList.toggle('zoom',zoom>1);grid.replaceChildren();document.querySelector('#count').textContent=`显示 ${found.length} 件 · ${size}px 宽 · ${zoom}× 整数显示`;document.querySelector('#progress').textContent=CATALOG.counts.ready===308?'308 件资源已生成；可按名称与功能检索，逐件下载。':`制作中：${CATALOG.counts.ready} / 308 件已生成，尚有 ${CATALOG.counts.missing} 件。此页只展示已有资源。`;
for(const r of found){const v=r.variants[String(size)],card=document.createElement('article');card.className='card';card.dataset.id=r.id;const stage=document.createElement('div');stage.className='stage';const inner=document.createElement('div');inner.className='inner';const img=document.createElement('img');img.alt=r.name;img.src=mode==='mother'?r.mother:r.files[String(size)];img.loading='lazy';if(mode==='mother'){img.className='mother';img.onerror=()=>{img.hidden=true;const note=document.createElement('p');note.className='missing-mother';note.textContent='母稿未安装：请从 GitHub Release 下载 icon-mothers.zip，并将 mothers/ 放入本目录。像素 PNG 可继续使用。';inner.style.maxWidth='260px';inner.style.width='auto';inner.append(note)}}inner.append(img);stage.append(inner);card.append(stage);const meta=document.createElement('div');meta.className='meta';const h=document.createElement('h2');h.textContent=r.name;const id=document.createElement('span');id.className='id';id.textContent=r.id;h.append(id);meta.append(h);const spec=document.createElement('div');spec.className='spec';spec.textContent=`${v.width}×${v.height} px · ${r.slot?'2×'+r.slot.rows+' 占格':'天赋 · 不占装备格'} · ${(v.bytes/1024).toFixed(1)} KiB`;meta.append(spec);const links=document.createElement('div');links.className='links';for(const [label,url] of [['下载 PNG',r.files[String(size)]],['下载母稿',r.mother]]){const a=document.createElement('a');a.textContent=label;a.href=url;a.download=r.id+(label.includes('PNG')?'-'+size:'-mother')+'.png';links.append(a)}meta.append(links);const details=document.createElement('details'),summary=document.createElement('summary'),desc=document.createElement('pre');summary.textContent='原始功能与资料';desc.textContent=r.description+(r.sourceFlags.length?'\n\n资料待核实：'+r.sourceFlags.join('；'):'');details.append(summary,desc);meta.append(details);card.append(meta);grid.append(card)}window.galleryState={size,zoom,mode,count:found.length};}
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{size=Number(b.dataset.size);setActive(b,'data-size');render()};for(const b of document.querySelectorAll('[data-zoom]'))b.onclick=()=>{zoom=Number(b.dataset.zoom);setActive(b,'data-zoom');render()};for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;setActive(b,'data-mode');render()};for(const b of document.querySelectorAll('[data-bg]'))b.onclick=()=>{document.body.classList.remove('light','check');if(b.dataset.bg!=='dark')document.body.classList.add(b.dataset.bg);setActive(b,'data-bg')};document.querySelector('#search').oninput=render;document.querySelector('#category').onchange=render;render();
</script></body></html>
